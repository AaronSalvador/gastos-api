spring:
  application:
    name: gastos-api
  profiles:
    # Si no indicas ningún perfil, se usa "local" (application-local.yml).
    # En Docker/producción define SPRING_PROFILES_ACTIVE o las variables de entorno.
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gastos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}          # obligatoria: sin valor por defecto
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}   # desactivado salvo que lo actives
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  cors:
    # Orígenes permitidos separados por coma (frontend)
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET}               # obligatoria: clave en Base64 (mínimo 32 bytes)
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 1 hora
  assistant:
    # Clave de la API de Anthropic. Si está vacía, el asistente funciona en "modo básico" (sin IA).
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ASSISTANT_MODEL:claude-haiku-5-5}
    max-tokens: ${ASSISTANT_MAX_TOKENS:600}
